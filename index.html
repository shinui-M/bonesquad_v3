    function openModal(date) {
        selectedDateKey = date;
        const myName = document.getElementById('userName').value.trim();
        document.getElementById('modalDateTitle').innerText = `${date} 성과 작성`;
        const myTask = (dbData.tasks||[]).find(t => t.date===date && t.name===myName);
        const c = document.getElementById('taskItemsContainer'); c.innerHTML = '';
        const rating = myTask ? parseTaskContent(myTask.task).rating || 0 : 0;
        document.getElementById('ratingSlider').value = rating;
        onRatingSliderChange(rating);
        if (myTask) {
            const parsed = parseTaskContent(myTask.task);
            if (parsed.items && parsed.items.length) parsed.items.forEach(item => addTaskItem(item));
            else addTaskItem();
        } else addTaskItem();
        document.getElementById('taskModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('taskModal').style.display = 'none'; }

    function saveTask() {
        const name = document.getElementById('userName').value.trim();
        const rating = document.getElementById('inputRating').value;
        if (!name) { alert('이름을 입력해주세요!'); return; }
        const items = [];
        document.querySelectorAll('#taskItemsContainer .input-row').forEach(row => {
            const type = row.querySelector('.type-select').value;
            const content = row.querySelector('.content-input').value.trim();
            if (content) items.push({ category:type, content });
        });
        if (!items.length) { alert('항목을 입력해주세요.'); return; }
        const nd = { action:'saveTask', date:selectedDateKey, name, task: JSON.stringify({ rating, items }) };
        dbData.tasks = (dbData.tasks||[]).filter(t => !(t.date===selectedDateKey && t.name===name));
        dbData.tasks.push(nd);
        renderWeeklyCalendar();
        closeModal();
        fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify(nd) });
    }

    function saveFeed() {
        const name = document.getElementById('userName').value.trim();
        const content = document.getElementById('inputFeed').value.trim();
        const img = document.getElementById('inputFeedImg').value.trim();
        if (!name || (!content && !img)) { alert('내용을 입력해주세요.'); return; }

        dbData.feeds.push(nd);
        renderFeed();

        document.getElementById('inputFeedImg').value = '';

        fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify({ action:'editFeed', id, name, content:nc2 }) });

    function saveMember() {

        const bio = document.getElementById('inputBio').value.trim();

        if (currentAvatarMode==='custom') { av=document.getElementById('customAvatarUrl').value.trim(); if(!av){alert('이미지 URL을 입력하세요.');return;} }

        const ca = ex&&ex.createdAt ? ex.createdAt : new Date().toISOString();
        const nd = { action:'saveMember', name, bio, avatar:av, createdAt:ca };

        const idx = dbData.members.findIndex(m => m.name===name);
        if (idx>=0) dbData.members[idx]=nd; else dbData.members.push(nd);
        localStorage.setItem('study_profile_'+name, JSON.stringify({ bio, avatar:av, createdAt:ca }));
        updateHeaderUser(name);

        fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify(nd) });
        alert('프로필 저장 완료!');

        if (mode==='random') updateAvatarPreview();
    }
    function previewCustomAvatar() { const u=document.getElementById('customAvatarUrl').value.trim(); if(u) document.getElementById('avatarPreview').src=u; }

    function openTab(name, e) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active'));
        document.getElementById(name).classList.add('active');
        e.currentTarget.classList.add('active');
        if (name==='calendarTab') renderWeeklyCalendar();
        if (name==='groupTab') renderGroupList();
        if (name==='snsTab') {
            localStorage.setItem('last_sns_visit', Date.now());
            document.getElementById('badge-snsTab').classList.remove('show');
        }
    }

    window.onclick = function(e) {
        if (e.target==document.getElementById('taskModal')) closeModal();
        if (e.target==document.getElementById('dayDetailModal')) closeDayDetail();
        if (e.target==document.getElementById('dietModal')) document.getElementById('dietModal').style.display='none';
        if (e.target==document.getElementById('weeklyCalendarModal')) closeWeeklyCalendarModal();
    };
</script>
</body>
</html>
